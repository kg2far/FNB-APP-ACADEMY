<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
	<title>Contact Management App</title>

    </head>
    
    <body onload="fetchContacts()">
        <div id="table">Contacts loading...</div>
        <button id="refresh" type="button">Refresh</button>
        <button id="addContact" type="button">Add Contact</button>
    
        <script src="config.js"></script>
        
        
        <script>
            
			document.getElementById("addContact").addEventListener('click', addContact);
            document.getElementById("refresh").addEventListener('click', fetchContacts);
			
            function fetchContacts(){
			
                fetch(rootPath + 'controller/get-contacts/?apiKey=' + apiKey)
                .then(function(response){
                    return response.json();
                })
                .then(function(data){
                    displayOutput(data);
                    //console.log(data);
                    
                    //13.03 13.12 13.18 13.29 13.38 13.46 13.55 13.58 14.02
                })
				.catch(function(error){
					console.log("Error:", error);
				});
            
        }
            function displayOutput(data){
              let  output = "<table >";
                
                for(a in data){
                    output += `
                        <tr>
                            
                            <td><img src="${rootPath}controller/uploads/${data[a].avatar}" width="20px"/></td>
							
                            <td><h5>${data[a].firstname}</h5></td>
                            <td><h5>${data[a].lastname}</h5></td>

							<td>
							<button onclick="editContact(${data[a].id})">Edit</button>
							</td>

							<td>
							<button onclick="deleteContact(${data[a].id})">Delete</button>
							</td>
       
                        </tr>
                       ` ;
                }
                output += "</table>";
                document.getElementById("table").innerHTML = output;
				

            }
			
			function addContact(){
				window.open("add-contacts.html", "_self");
				}
			function editContact(id){
				localStorage.setItem("id" , id);
				window.open("edit-contact.html", "_self");
			}
			function deleteContact(id){
				
				if(confirm("Are you sure you want to delete this contact?")){
				fetch(rootPath + 'controller/delete-contact/?id=' + id +'&apiKey=' + apiKey)
				
				.then(function(response){
					return response.text();
				})
				
				.then(function(data){
					fetchContacts();
				})
				
				.catch(function(error){
					console.log(error);
				})
			}
			}
        
        </script>
    
    </body>
    
</html>
